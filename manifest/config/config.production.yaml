# 生产环境配置
server:
  address: ":7001"
  gracefulTimeout: 15

app:
  keys:
    - "SzNg8LgHjEUgTAc4"
  # 跨域白名单。生产环境留空即不允许浏览器跨域调用，H5 与 API 需要同域（同一域名下的静态目录/反代）。
  # 若必须跨域，按下面格式填写页面所在域名（不带结尾斜杠），也可用环境变量 APP_CORS_ORIGINS 覆盖。
  # allowedOrigins:
  #   - "https://h5.example.com"
  allowedOrigins: []

database:
  default:
    link: "mysql:root:change_me@tcp(192.168.0.10:3219)/game_db_1?charset=utf8mb4&parseTime=true&loc=Local"
    debug: false
    cache: true
    maxIdle: 50
    maxOpen: 60
    maxLifetime: 3600
    slowThreshold: 300

redis:
  default:
    address: "192.168.0.20:6379"
    pass: "change_me"
    db: 0
    dialTimeoutMs: 3000
    readTimeoutMs: 500
    writeTimeoutMs: 500
    poolSize: 100
    minIdleConns: 10
    poolTimeoutMs: 1000

logger:
  level: "info"
  format: "json"
  outputPaths:
    - "stdout"
