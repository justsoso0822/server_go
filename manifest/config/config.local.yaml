# 本地容器环境配置（docker compose 内用）
server:
  address: ":7001"
  gracefulTimeout: 15

app:
  keys:
    - "SzNg8LgHjEUgTAc4"
  # 跨域白名单。留空时本地环境回显任意 Origin，H5 在 LayaAir 内置服务器（如 18090）调试可直接访问 17001 网关。
  # 也可用环境变量 APP_CORS_ORIGINS 覆盖，逗号分隔。
  allowedOrigins: []

database:
  default:
    link: "mysql:root:root@tcp(mysql:3306)/game_db_1?charset=utf8mb4&parseTime=true&loc=Local"
    debug: true
    maxIdle: 50
    maxOpen: 100
    maxLifetime: 3600
    slowThreshold: 300

redis:
  default:
    address: "redis:6379"
    pass: "root"
    db: 0
    dialTimeoutMs: 3000
    readTimeoutMs: 500
    writeTimeoutMs: 500
    poolSize: 20
    minIdleConns: 2
    poolTimeoutMs: 1000

logger:
  level: "info"
  format: "console"
  outputPaths:
    - "stdout"
