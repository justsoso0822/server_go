# 测试环境配置
server:
  address: ":7001"
  gracefulTimeout: 15

app:
  keys:
    - "SzNg8LgHjEUgTAc4"
  # 跨域白名单。留空时测试环境回显任意 Origin，便于内网联调；如需收紧按下面格式填写。
  # allowedOrigins:
  #   - "http://192.168.0.10:18090"
  allowedOrigins: []

database:
  default:
    link: "mysql:root:change_me@tcp(172.17.0.14:3306)/game_db_1?charset=utf8mb4&parseTime=true&loc=Local"
    debug: false
    maxIdle: 50
    maxOpen: 100
    maxLifetime: 3600
    slowThreshold: 300

redis:
  default:
    address: "172.17.25.15:6379"
    pass: "change_me"
    db: 20
    dialTimeoutMs: 3000
    readTimeoutMs: 500
    writeTimeoutMs: 500
    poolSize: 100
    minIdleConns: 10
    poolTimeoutMs: 1000

logger:
  level: "info"
  format: "json"
  outputPaths:
    - "stdout"
